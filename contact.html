    <main>
      <h1>Contact us</h1>
      <p>Questions about Harbor Notes? Send us a note.</p>
      <form id="contact-form">
        <label for="contact-name">Name</label>
        <input id="contact-name" type="text" required />
        <label for="contact-email">Email</label>
        <input id="contact-email" type="email" required placeholder="you@example.com" />
        <label for="contact-message">Message</label>
        <textarea id="contact-message" rows="4" required></textarea>
        <button type="submit">Send message</button>
      </form>
      <p id="contact-status" role="status"></p>
    </main>

    <footer class="site-footer">Harbor Notes, a static site.</footer>
