<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pricing - Harbor Notes</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">Harbor Notes</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="features.html">Features</a>
        <a href="pricing.html" aria-current="page">Pricing</a>
        <a href="about.html">About</a>
      </nav>
    </header>

    <main>
      <h1>Pricing</h1>
      <button type="button" id="billing-toggle">Show yearly prices</button>
      <ul class="plans">
        <li class="plan">
          <h2>Starter</h2>
          <p class="price" data-monthly="$0" data-yearly="$0">$0</p>
          <p>One notebook, synced on two devices.</p>
        </li>
        <li class="plan">
          <h2>Pro</h2>
          <p class="price" data-monthly="$6" data-yearly="$60">$6</p>
          <p>Unlimited notebooks and sharing.</p>
        </li>
      </ul>
    </main>

    <footer class="site-footer">Harbor Notes, a static site.</footer>
    <script src="app.js"></script>
  </body>
</html>
